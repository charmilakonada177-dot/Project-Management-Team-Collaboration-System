<!DOCTYPE html>
<html>

<head>

    <title>Projects</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<nav>

    <h2>Projects</h2>

    <a href="/dashboard">Dashboard</a>

</nav>

<div class="dashboard">

    <h1>My Projects</h1>

    <a class="button" href="/create-project">
        + Create Project
    </a>

    <br><br>

    {% for project in projects %}

    <div class="project">

        <h2>{{ project["name"] }}</h2>

        <p>{{ project["description"] }}</p>

        <p>
            Start:
            {{ project["start_date"] }}
        </p>

        <p>
            End:
            {{ project["end_date"] }}
        </p>

        <a href="/project/{{ project['id'] }}">
            Open Project
        </a>

    </div>

    {% else %}

    <p>No projects available.</p>

    {% endfor %}

</div>

</body>

</html>
